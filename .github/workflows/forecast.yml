name: SET50 Forecast Auto-Update

on:
  schedule:
    - cron: '*/30 3-10 * * 1-5'
    - cron: '30 10 * * 1-5'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - '.github/workflows/**'

jobs:
  forecast:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: pip install yfinance pandas numpy
      - name: Run forecast engine
        run: python scripts/engine.py
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/
          git diff --staged --quiet || git commit -m "🤖 Auto-update forecast $(date -u +%Y-%m-%d-%H%M)"
          git push
